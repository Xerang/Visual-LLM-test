server.port=8080
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
vision.service-url=${VISION_SERVICE_URL:http://localhost:8000}
vision.read-timeout-seconds=${VISION_READ_TIMEOUT_SECONDS:300}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bozor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.schemas=bozor_poc
spring.flyway.default-schema=bozor_poc
spring.flyway.create-schemas=true
